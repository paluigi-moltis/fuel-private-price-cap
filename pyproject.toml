[project]
name = "fuel-private-price-cap"
version = "0.1.0"
description = "Analysis of the oil companies' self-imposed fuel price cap (2026-09-28)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kaleido>=1.4.0",
    "plotly[express]>=7.1.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pymongo>=4.18.2",
    "pyproj>=3.8.0",
    "pyshp>=3.1.6",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
]

[project.scripts]
fuel-price-cap = "fuel_price_cap.main:main"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fuel_price_cap"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 88
target-version = ["py314"]
